name: diag-xcode

# 临时诊断：确认 runner 上可用的 Xcode 版本。用完即删。
on:
  workflow_dispatch:

jobs:
  macos15:
    name: Xcode on macos-15
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: List Xcode installations
        run: |
          echo '--- /Applications ---'
          ls -d /Applications/Xcode*.app 2>/dev/null || echo 'none'
          echo '--- xcode-select ---'
          xcode-select -p
          xcodebuild -version
          echo '--- newest selectable ---'
          ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -3
          echo '--- xcodebuild -showsdks ---'
          xcodebuild -showsdks 2>/dev/null | head -20

  macos26:
    name: Xcode on macos-26
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check label availability
        run: |
          echo 'macos-26 runner is available'
          xcode-select -p
          xcodebuild -version
          ls -d /Applications/Xcode*.app 2>/dev/null || echo 'none'
